<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NotesLab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8rem 2rem 4rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">NotesLab.</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="subject.html">Subjects</a>
            <a href="exam_prep.html">Exam Prep</a>
            <a href="about.html">About</a>
            <a href="login.html" class="btn-login">Log in</a>
        </div>

        <div class="theme-switch-wrapper">
            <button id="theme-toggle" class="theme-btn" title="Switch Theme">
                <i class="fas fa-palette"></i>
            </button>
            <div class="theme-options">
                <div class="theme-option" data-color="blue" style="background: #3b82f6;"></div>
                <div class="theme-option" data-color="yellow" style="background: #eab308;"></div>
                <div class="theme-option" data-color="black" style="background: #000;"></div>
            </div>
        </div>

        <div class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- Signup Form -->
    <section class="login-section">
        <div class="contact-form fade-in" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
            <form id="signup-form" autocomplete="off">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Full Name</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Email
                        Address</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="Create a password"
                        required>
                </div>

                <div id="signup-error"
                    style="color: var(--accent); font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>

                <button type="submit" class="submit-btn" style="margin-bottom: 1rem;">Sign Up</button>

                <button type="button" class="google-btn" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Sign up with Google
                </button>

                <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 1.5rem;">
                    Already have an account? <a href="login.html" style="color: var(--primary);">Log in</a>
                </p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="logo">NotesLab.</div>
            <div class="social-links">
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> Ashutosh More</a>
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> Raj Singhania</a>
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> Himanshu Chawre</a>
            </div>
            <p class="copyright">&copy; 2025 NotesLab. Built with ❤️ by Ashutosh & Team.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
